<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Expense Tracker interface -->

     <!-- Navbar -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container d-flex justify-content-between">
        <span class="navbar-brand mb-0 h1">Expense Tracker</span>
        <button id="dark-mode-toggle" class="btn btn-outline-light btn-sm">Dark Mode</button>
    </div>
</nav>

<div class="container">
    <!-- Alerts Container -->
    <div id="alert-container"></div>

    <!-- Summary Cards (CSS Grid) -->
    <div class="summary-grid mb-4 text-center">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Total</h5>
                <h3 id="total-amount">0.00</h3>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Number of expenses</h5>
                <h3 id="expenses-count">0</h3>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Highest expense</h5>
                <h3 id="highest-expense">0.00</h3>
            </div>
        </div>
    </div>

    <!-- Add Expense Form -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title">Add expense</h5>
            <form id="add-expense-form">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Title</label>
                        <input type="text" id="title" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Amount</label>
                        <input type="number" id="amount" step="0.01" min="0.01" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Category</label>
                        <select id="category" class="form-select" required>
                            <option value="" disabled selected>Choose...</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Date</label>
                        <input type="date" id="date" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Add expense</button>
            </form>
        </div>
    </div>

    <!-- Table, Filter, and Search Section -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h4>Expenses</h4>
        <div class="d-flex flex-wrap align-items-center gap-3">
            <!-- Search by Title Input -->
            <input type="text" id="search-title" class="form-control w-auto" placeholder="Search by title...">
            
            <!-- Category Filter -->
            <div class="d-flex align-items-center">
                <label class="me-2 mb-0">Category</label>
                <select id="filter-category" class="form-select w-auto">
                    <option value="All">All</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="text-center my-4" style="display: none;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
   
    <!-- Expenses Table -->
    <div class="table-responsive">
    <table class="table table-bordered table-striped" id="expenses-table">
        <thead class="table-light">
            <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="expenses-list">
            <!-- Expenses will be injected here -->
        </tbody>
    </table>
    </div>
</div>

<!-- Edit Expense Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Expense</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="edit-expense-form">
                    <input type="hidden" id="edit-id">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" id="edit-title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount</label>
                        <input type="number" id="edit-amount" step="0.01" min="0.01" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select id="edit-category" class="form-select" required>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" id="edit-date" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
